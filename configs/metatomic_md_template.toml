# Copy this file for a new material, adsorbate, or exported metatomic MLIP.
# Set required_elements only when that check is scientifically useful.

[run]
name = "material-model-label"
output_dir = "../output/material-model-label"

[structure]
path = "../data/your-structure-with-ch4.cif"
# required_elements = ["C", "H", "O", "Zn"]

[model]
md_backend = "metatomic"
# A pre-exported .pt can be used directly. Leave checkpoint unset in that case.
exported_model = "../models/your-exported-model.pt"
device = "cuda"
# Set `ad_backend = "pet-jax"` plus checkpoint/jax_checkpoint only for a
# compatible PET-JAX model. Other metatomic MLIPs currently support MD only.
ad_backend = "none"

[md]
temperature_K = 300.0
steps = 1000
timestep_fs = 0.25
prefix = "material-md"

[heat_capacity]
# These values are ignored while ad_backend = "none".
frames = "1"
temperatures_K = "100:500:10"
dtype = "float32"
chunk_size = 1
hops = 3
remat = true
shadow = false
