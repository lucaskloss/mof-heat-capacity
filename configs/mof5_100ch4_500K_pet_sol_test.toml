[run]
name = "mof5-100ch4-500K-pet-sol-s-best-nostress-test"
output_dir = "../output/mof5-100ch4-500K-pet-sol-s-best-nostress-test"

[structure]
path = "../output/structures/mof5-100ch4-seed2025.pdb"
required_elements = ["C", "H", "O", "Zn"]

[model]
md_backend = "metatomic"
ad_backend = "pet-jax"
checkpoint = "../models/pet_sol-s-best_nostress.ckpt"
exported_model = "../models/pet_sol-s-best_nostress.pt"
jax_checkpoint = "../models/pet_sol-s-best_nostress_jax"
device = "cuda"

[md]
temperature_K = 500.0
steps = 4000
timestep_fs = 0.5
prefix = "mof5-100ch4-500K-pet-sol-s-best-nostress-test"

[heat_capacity]
frames = "1"
temperatures_K = "100:500:10"
dtype = "float32"
chunk_size = 1
hops = 3
remat = true
shadow = false
