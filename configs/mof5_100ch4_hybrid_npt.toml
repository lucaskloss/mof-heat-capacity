# Classical anharmonic term for the Hessian-corrected loaded-MOF workflow.
# Preparation copies this template for every temperature and replica.

[run]
name = "mof5-100ch4-hybrid-npt-300K-rep01"
output_dir = "../output/md/production/REPLACE_WITH_MODEL_LABEL/100ch4/300K/rep01"

[structure]
path = "../output/md/structures/100ch4/300K/rep01/structure.pdb"
required_elements = ["C", "H", "O", "Zn"]

[model]
md_backend = "metatomic"
ad_backend = "pet-jax"
checkpoint = "../models/REPLACE_WITH_STRESS_VALIDATED.ckpt"
exported_model = "../models/REPLACE_WITH_STRESS_VALIDATED.pt"
jax_checkpoint = "../models/REPLACE_WITH_STRESS_VALIDATED_jax"
device = "cuda"
stress_validated = false

[md]
driver = "lammps"
ensemble = "npt-flexible"
temperature_K = 300.0
pressure_bar = 1.0
steps = 1000000                 # 500 ps total
equilibration_steps = 200000    # first 100 ps
timestep_fs = 0.5
thermostat = "nose-hoover-chain"
thermostat_tau_fs = 100.0
thermostat_chain_length = 3
barostat = "mttk"
barostat_tau_fs = 1000.0
output_stride = 100             # 0.05 ps
restart_stride = 100000         # 50 ps
seed = 202501
prefix = "md"
trajectory_file = "trajectory.lammpstrj"

[execution]
lammps_command = "lmp"

[heat_capacity]
frames = "1"
start_frame = 0
temperatures_K = "100:500:10"
dtype = "float32"
chunk_size = 1
hops = 3
remat = true
shadow = false
