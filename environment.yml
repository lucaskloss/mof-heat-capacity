name: mof-heat-capacity

# Keep metatensor first: the metatomic LAMMPS build comes from this channel.
# Do not replace it with an ordinary conda-forge build.
channels:
  - metatensor
  - conda-forge

dependencies:
  - python=3.12
  - jupyterlab
  # LAMMPS links to Conda's C++ libtorch, independently of the pip Torch wheel
  # below. Pin both sides of that ABI and keep the C++ runtime in CUDA 12:
  # Izar's 535 driver cannot initialize the otherwise-selected CUDA 13 build.
  - "lammps-metatomic=2026.07.04.mta1=*cpu*mpi_openmpi*"
  - "libtorch=2.12.1=cuda129_mkl_*"
  - cuda-version=12.9
  - mkl>=2026,<2027
  - pip
  - pip:
      # PyPI's current default torch wheel uses CUDA 13, which cannot run on
      # Izar's V100/535-series driver. Keep torch in the CUDA 12 family.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # CUDA 12.1 is the newest pinned PyTorch wheel here with V100 kernels.
      - "torch==2.5.1+cu121"
      - ase>=3.23
      - anywidget>=0.9
      - chemiscope>=1.1.0
      - ipywidgets>=8.1
      - matplotlib
      - metatomic-ase>=0.1.2
      - "nvalchemi-toolkit-ops[torch]==0.3.1"
      - ipi>=3.2.0
      - "jax[cuda12]==0.11.0"
      - "jax-cuda12-plugin==0.11.0"
      - "jax-cuda12-pjrt==0.11.0"
      - upet>=0.2.6
      # metatomic-ase 0.1.2 requires Vesin 0.6.x (the 0.4 API lacks `skin`).
      - "vesin==0.6.1"
