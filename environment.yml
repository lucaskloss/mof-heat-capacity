name: mof-heat-capacity

# Keep metatensor first: the metatomic LAMMPS and GROMACS builds come from this
# channel. Do not replace either package with an ordinary conda-forge build.
channels:
  - metatensor
  - conda-forge

dependencies:
  - python=3.12
  - jupyterlab
  - gromacs-metatomic
  - lammps-metatomic
  - pip
  - pip:
      - ase>=3.23
      - anywidget>=0.9
      - chemiscope>=1.1.0
      - ipywidgets>=8.1
      - matplotlib
      - metatomic-ase>=0.1.2
      - ipi>=3.2.0
      - "jax[cuda13]"
      - upet>=0.2.6
      - vesin>=0.4.2
